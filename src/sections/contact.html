<section class="section-pad border-t border-line bg-[#0A0A0C]" id="contact">
    <div class="mx-auto flex max-w-7xl flex-col gap-16 lg:flex-row lg:gap-20">
        <div class="animate-on-scroll flex w-full flex-col justify-center transition-all duration-1000 ease-out lg:w-1/2">
            <h2 class="font-heading mb-8 text-5xl font-extrabold leading-[0.9] tracking-[-0.07em] md:text-7xl">
                <span class="block text-paper">Let's build something</span>
                <span class="block text-primary">remarkable.</span>
            </h2>

            <p class="mb-12 max-w-md text-lg leading-relaxed text-muted">
                Currently available for freelance opportunities and full-time roles. Let's discuss your next big idea.
            </p>

            <div class="flex flex-col items-start gap-6">
                <a href="mailto:mohitkoley5@gmail.com"
                    class="group relative inline-block text-2xl font-semibold text-paper transition-colors hover:text-primary md:text-3xl">
                    mohitkoley5@gmail.com
                    <span class="absolute bottom-0 left-0 h-[2px] w-full origin-left scale-x-0 bg-primary transition-transform duration-300 group-hover:scale-x-100"></span>
                </a>
                <a href="https://www.linkedin.com/in/mohitkoley2211/" target="_blank" rel="noreferrer"
                    class="group relative inline-block text-xl text-muted transition-colors hover:text-primary md:text-2xl">
                    linkedin.com/in/mohitkoley2211
                    <span class="absolute bottom-0 left-0 h-px w-full origin-left scale-x-0 bg-primary transition-transform duration-300 group-hover:scale-x-100"></span>
                </a>
                <a href="https://github.com/Mohitkoley" target="_blank" rel="noreferrer"
                    class="group relative inline-block text-xl text-muted transition-colors hover:text-primary md:text-2xl">
                    github.com/Mohitkoley
                    <span class="absolute bottom-0 left-0 h-px w-full origin-left scale-x-0 bg-primary transition-transform duration-300 group-hover:scale-x-100"></span>
                </a>
            </div>
        </div>

        <div class="animate-on-scroll flex w-full items-center transition-all delay-200 duration-1000 ease-out lg:w-1/2">
            <form id="contact-form" action="https://formspree.io/f/mqeqlwbw" method="POST"
                class="ml-auto flex w-full max-w-md flex-col gap-6">
                <div class="flex flex-col gap-2">
                    <label class="text-sm font-semibold text-muted" for="name">Name</label>
                    <input class="field" id="name" name="name" placeholder="John Doe" required type="text" />
                </div>
                <div class="flex flex-col gap-2">
                    <label class="text-sm font-semibold text-muted" for="email">Email</label>
                    <input class="field" id="email" name="email" placeholder="john@example.com" required type="email" />
                </div>
                <div class="flex flex-col gap-2">
                    <label class="text-sm font-semibold text-muted" for="message">Message</label>
                    <textarea class="field resize-none" id="message" name="message" placeholder="Tell me about your project..." required rows="4"></textarea>
                </div>
                <button id="submit-btn" type="submit"
                    class="mt-4 flex items-center justify-center gap-2 rounded-md bg-primary py-4 font-extrabold uppercase tracking-[0.18em] text-ink transition-colors duration-300 hover:bg-paper disabled:cursor-not-allowed disabled:opacity-70">
                    <span id="btn-text">Send Message</span>
                    <svg id="btn-loader" class="hidden h-5 w-5 animate-spin text-ink" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor"
                            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                        </path>
                    </svg>
                </button>
            </form>
        </div>
    </div>
</section>
